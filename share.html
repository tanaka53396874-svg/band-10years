<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バンド、10年やってみた — 共有結果</title><style>body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#101114;color:#eee;max-width:860px;margin:auto;padding:28px 16px;line-height:1.75}h1{font-size:1.7rem}.card{background:#191b20;border:1px solid #353942;border-radius:12px;padding:16px;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#aaa}a{color:#fff}.cta{display:inline-block;padding:13px 18px;background:#eee;color:#111;border-radius:9px;text-decoration:none;font-weight:bold}.year{border-left:3px solid #777}</style></head><body><header><h1>バンド、10年やってみた</h1><p class="muted">共有された10年間の記録</p></header><main id="content"><p>結果を読み込んでいます…</p></main><p><a class="cta" href="/">あなたも10年間バンドをやってみる</a></p><script>
function add(parent,tag,text,className){const el=document.createElement(tag);if(className)el.className=className;el.textContent=text;parent.appendChild(el);return el}
(async()=>{const root=document.getElementById('content');try{const id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9a-f]{16}$/.test(id))throw Error('共有URLが正しくありません。');const response=await fetch('/api/result/'+id);if(!response.ok)throw Error(response.status===404?'この共有結果は見つかりません。':'結果を取得できませんでした。');const data=await response.json(),r=data.result;if(!r||r.game!=='band-10years'||r.version!==1||typeof r.band!=='string'||!Array.isArray(r.years)||!Array.isArray(r.roster)||typeof r.result!=='string'||typeof r.epilogue!=='string')throw Error('結果のデータ形式が正しくありません。');root.replaceChildren();add(root,'h2',r.band);add(root,'p',r.meta||'','muted');add(root,'h2','MEMBERS');for(const m of r.roster)add(root,'div',String(m),'card');add(root,'h2','10 YEARS');for(const y of r.years)add(root,'div',String(y),'card year');add(root,'h2','RESULT');add(root,'div',r.result,'card');add(root,'h2','EPILOGUE');add(root,'div',r.epilogue,'card');}catch(e){root.replaceChildren();add(root,'p',e.message||'読み込みに失敗しました。')}})();
</script></body></html>
